<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РоМоменты — Roblox Видео</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Ро<span>Моменты</span></div>
    <button class="btn-primary" onclick="openModal()">+ Загрузить роМомент</button>
  </header>

  <main class="video-grid" id="videoGrid"></main>

  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Загрузить роМомент</h2>
      <form id="uploadForm">
        <input type="text" id="videoTitle" placeholder="Название видео" required>
        <select id="videoCategory">
          <option value="Blox Fruits">Blox Fruits</option>
          <option value="Pet Simulator">Pet Simulator</option>
          <option value="Другое">Другое</option>
        </select>
        <label>Файл видео (.mp4):</label>
        <input type="file" id="videoFile" accept="video/mp4" required>
        <label>Обложка (Картинка):</label>
        <input type="file" id="thumbFile" accept="image/*" required>
        <button type="submit" class="btn-submit">Опубликовать</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
